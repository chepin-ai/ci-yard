name: yard-llm-bench
# ci-yard 公域免费分钟面 LLM 联测（自 ci-control 私仓迁出：私仓分钟只保哨戒）
# 矩阵：6 场景 × 6 模型 × 温度 2 档；DeepSeek 谷段闸在脚本内判定（非 step-if）
# 缺密 provider 由脚本检测并记「缺密跳过」行，continue-on-error 保底不红班
# 纪律：无 step-level if 涉 secrets；python 负载零字面 ${{ }}（负载全在 scripts/yard_bench.py）
on:
  schedule:
    - cron: '7 */2 * * *'    # 每 2h 一班
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: yard-llm-bench
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: inline app-token (拔除外action依赖:DNS瞬断根因治理,D-090)
        env:
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
        run: |
          pip -q install pyjwt requests
          python3 - <<'PYEOF'
          import jwt,time,json,os,urllib.request
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['LINE_ID']},os.environ['LINE_KEY'],algorithm='RS256')
          H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
          inst=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)))
          iid=[i['id'] for i in inst if i['account']['login']=='chepin-ai'][0]
          rq=urllib.request.Request(f'https://api.github.com/app/installations/{iid}/access_tokens',method='POST',headers=H); rq.data=b'{}'
          tok=json.load(urllib.request.urlopen(rq))['token']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('token='+tok+chr(10)+')'
          PYEOF
        id: app
      - name: LLM 联测矩阵（缺密自动跳过 / DeepSeek 谷段闸 / 回写用量台账）
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHARED_KEYS: ${{ secrets.SHARED_KEYS }}
        run: python3 scripts/yard_bench.py
